<!DOCTYPE html>
<html lang="en">
<head>
    <title>Car Price Prediction</title>
</head>
<body>
    <h1>Used Car Price Prediction</h1>
    <form action="/predict" method="POST">
        <label>Present_Price:</label>
        <input type="number" step="any" name="present_price" required>
        <br><br>

        <label>Kms Driven</label>
        <input type="number" name="kms_driven" required>
        <br><br>

        <label>Fuel Type:</label>
        <select name="fuel_type">
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
            <option value="CNG">CNG</option>
        </select>


        <label>Transmission:</label>
        <select name="transmission" >
            <option value="Manual">Manual</option>
            <option value="Automatic">Automatic</option>
        </select>
        <br><br>


        <label>Car Age:</label>
        <input type="number" name="car_age" min="0" required>
        <br><br>

        <label>Owner:</label>
        <input type="number" name="owner" min="0" required>

        <label>Seller Type:</label>
        <select name="seller_type">
            <option value="dealer">Dealer</option>
            <option value="Individual">Individual</option>
        </select>

        <button type="submit">Predict Price</button>
    </form>
        {% if prediction %}
        <h2>Predicted Selling Price: ₹ {{ prediction }} Lakhs</h2>
    {% endif %}
</body>
</html>
